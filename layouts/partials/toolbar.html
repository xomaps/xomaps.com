<!-- ═══════════════════════════════════════════════════════════════
     ★ 右侧悬浮快捷工具栏 HTML（复制此 <aside> 到你的页面 body 末尾）
     ══════════════════════════════════════════════════════════════ -->
<aside class="side-tools" id="sideTools">

  <!-- ★ 1. 在线咨询（href 改成你的咨询/客服链接） -->
  <a class="side-tool consult-btn" href="/contact.html#form" aria-label="在线咨询">
    <span class="ring"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span class="tip">在线咨询</span>
  </a>

  <!-- 2. 企业微信二维码 -->
  <a class="side-tool wechat-btn" href="javascript:void(0)" aria-label="微信二维码">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 3C4.9 3 2 5.5 2 8.6c0 1.8 1 3.4 2.5 4.4l-.6 2 2.2-1.1c.6.2 1.2.3 1.9.3-.1-.4-.1-.8-.1-1.2 0-3 2.9-5.4 6.4-5.4h.4C14 5.1 11.5 3 8.5 3zM6.4 6.3c.4 0 .8.3.8.8s-.4.8-.8.8-.8-.4-.8-.8.4-.8.8-.8zm4.2 0c.4 0 .8.3.8.8s-.4.8-.8.8-.8-.4-.8-.8.4-.8.8-.8zM14.5 9c-3 0-5.5 2.1-5.5 4.8s2.5 4.8 5.5 4.8c.6 0 1.2-.1 1.7-.3l2 1-.6-1.8c1.5-.9 2.4-2.3 2.4-3.9 0-2.7-2.5-4.6-5.5-4.6zm-1.9 2.7c.4 0 .7.3.7.7s-.3.7-.7.7-.7-.3-.7-.7.3-.7.7-.7zm3.8 0c.4 0 .7.3.7.7s-.3.7-.7.7-.7-.3-.7-.7.3-.7.7-.7z"/></svg>
    <div class="qr-popup">
      <div class="qr-img">
        <img src="/assets/img/wecom-qrcode.png" alt="企业微信二维码：扫码添加商务顾问" loading="lazy">
      </div>
      <div class="qr-label">扫码加商务微信</div>
      <div class="qr-sub">获取方案与报价</div>
    </div>
  </a>

  <!-- ★ 3. 邮箱（mailto: 后改成你的邮箱） -->
  <a class="side-tool" href="mailto:sales@xomaps.com" aria-label="发送邮件">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    <span class="tip">sales@xomaps.com</span>

  <!-- ★ 4. 电话（tel: 后改成你的电话，气泡文字同步改） -->
  <a class="side-tool" href="tel:18926108189" aria-label="拨打电话">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

  <!-- 5. 回到顶部（无需配置） -->
  <a class="side-tool top-btn" href="javascript:void(0)" id="backToTop" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
    <span class="tip">回到顶部</span>
  </a>

</aside>
<!-- ═══════════════════════════════════════════════════════════════
     ★ 工具栏交互脚本（复制此 <script> 到页面末尾，在 <div style="display:none;">cache</div><div style="text-align:center;display:none;"><span>Processed in 0.012156 Second.</span></div></body> 之前）
     ══════════════════════════════════════════════════════════════ -->
<script>
(function(){
  var btn=document.getElementById('backToTop');
  if(!btn){return;}

  /* 滚动超过 400px 时显示回到顶部按钮 */
  function onScroll(){
    if(window.scrollY>400){btn.classList.add('show');}
    else{btn.classList.remove('show');}
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();

  /* 点击平滑回到顶部 */
  btn.addEventListener('click',function(){
    window.scrollTo({top:0,behavior:'smooth'});
  });

  /* 移动端：点击微信按钮切换二维码弹窗 */
  var wx=document.querySelector('.wechat-btn');
  if(wx){
    wx.addEventListener('click',function(e){
      if(window.innerWidth<=640){
        e.preventDefault();
        wx.classList.toggle('qr-open');
      }
    });
    /* 点击页面其他位置关闭移动端二维码弹窗 */
    document.addEventListener('click',function(e){
      if(window.innerWidth<=640 && !wx.contains(e.target)){
        wx.classList.remove('qr-open');
      }
    });
  }
})();
</script>
