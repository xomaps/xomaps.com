<style id="ww-nav-style">
  /* ===== 变量收窄作用域，不污染站点全局 ===== */
  #ww-navbar{
    --ww-brand:#2563eb !important;
    --ww-brand-2:#3b82f6 !important;
    --ww-brand-text:#0f2c5e !important;
    --ww-text:#1f2937 !important;
    --ww-text-2:#4b5563 !important;
    --ww-text-3:#6b7280 !important;
    --ww-border:#e2e8f0 !important;
    --ww-shadow:0 10px 30px rgba(30,58,138,0.10) !important;
    --ww-radius:12px !important;
  }

  /* ===== 导航条外层（ID 选择器 + !important，压过站点全局样式） ===== */
  #ww-navbar{
    position:fixed !important;
    top:0 !important;
    left:0 !important;
    right:0 !important;
    z-index:99999 !important;
    display:block !important;
    margin:0 !important;
    padding:0 24px !important;
    border:0 !important;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif !important;
    line-height:1.7 !important;
    font-size:15px !important;
    -webkit-font-smoothing:antialiased !important;
    transition:all .45s cubic-bezier(.22,1,.36,1) !important;
  }
  #ww-navbar::before{
    content:"" !important;
    position:absolute !important;
    inset:0 !important;
    z-index:-1 !important;
    background:linear-gradient(135deg,#ffffff 0%,#eff6ff 35%,#e0f2fe 70%,#ffffff 100%) !important;
    transition:all .45s cubic-bezier(.22,1,.36,1) !important;
  }

  /* ===== 滚动后：收缩为 1200px 并固定顶部 ===== */
  #ww-navbar.ww-scrolled{
    top:12px !important;
    left:50% !important;
    right:auto !important;
    transform:translateX(-50%) !important;
    width:1200px !important;
    max-width:calc(100% - 48px) !important;
    padding:0 !important;
    border-radius:12px !important;
    box-shadow:var(--ww-shadow) !important;
  }
  #ww-navbar.ww-scrolled::before{
    border-radius:12px !important;
    background:linear-gradient(135deg,rgba(255,255,255,0.96) 0%,rgba(239,246,255,0.96) 45%,rgba(224,242,254,0.94) 100%) !important;
    backdrop-filter:saturate(180%) blur(14px) !important;
  }

  /* ===== 内层：flex 布局三段（logo 左 / 菜单中 / 按钮右） ===== */
  #ww-navbar .ww-inner{
    display:flex !important;
    flex-direction:row !important;
    align-items:center !important;
    justify-content:space-between !important;
    max-width:1400px !important;
    width:100% !important;
    height:72px !important;
    margin:0 auto !important;
    padding:0 !important;
    gap:0 !important;
    box-sizing:border-box !important;
    transition:all .45s cubic-bezier(.22,1,.36,1) !important;
  }
  #ww-navbar.ww-scrolled .ww-inner{
    max-width:1200px !important;
    padding:0 28px !important;
    height:60px !important;
  }

  /* ===== Logo：强制最左 ===== */
  #ww-navbar .ww-logo{
    display:flex !important;
    align-items:center !important;
    flex-shrink:0 !important;
    margin:0 !important;
    margin-right:auto !important;
    padding:0 !important;
    color:var(--ww-brand-text) !important;
    text-decoration:none !important;
    transition:all .45s cubic-bezier(.22,1,.36,1) !important;
  }
  #ww-navbar .ww-logo img{
    height:42px !important;
    width:auto !important;
    max-width:none !important;
    display:block !important;
    margin:0 !important;
    padding:0 !important;
    object-fit:contain !important;
    vertical-align:middle !important;
    transition:all .45s cubic-bezier(.22,1,.36,1) !important;
  }
  #ww-navbar.ww-scrolled .ww-logo img{height:34px !important}

  /* ===== 菜单：中部导航项 ===== */
  #ww-navbar .ww-menu{
    display:flex !important;
    flex-direction:row !important;
    align-items:center !important;
    justify-content:center !important;
    gap:8px !important;
    list-style:none !important;
    margin:0 !important;
    padding:0 !important;
    flex-shrink:0 !important;
  }
  #ww-navbar .ww-menu > li{
    position:relative !important;
    list-style:none !important;
    margin:0 !important;
    padding:0 !important;
  }
  #ww-navbar .ww-menu > li > a{
    display:flex !important;
    align-items:center !important;
    gap:5px !important;
    padding:10px 16px !important;
    margin:0 !important;
    font-size:14.5px !important;
    color:var(--ww-text-2) !important;
    font-weight:500 !important;
    line-height:1 !important;
    background:transparent !important;
    border:0 !important;
    border-radius:8px !important;
    text-decoration:none !important;
    white-space:nowrap !important;
    transition:all .2s !important;
  }
  #ww-navbar .ww-menu > li > a:hover{
    color:var(--ww-brand) !important;
  }
  #ww-navbar .ww-menu > li > a.ww-active{
    color:var(--ww-brand) !important;
    font-weight:600 !important;
  }

  /* ===== 电话按钮：强制最右 ===== */
  #ww-navbar .ww-actions{
    display:flex !important;
    flex-direction:row !important;
    align-items:center !important;
    justify-content:flex-end !important;
    gap:14px !important;
    flex-shrink:0 !important;
    margin:0 !important;
    margin-left:auto !important;
    padding:0 !important;
  }
  #ww-navbar .ww-phone{
    display:inline-flex !important;
    align-items:center !important;
    gap:8px !important;
    padding:9px 18px !important;
    margin:0 !important;
    border-radius:20px !important;
    border:0 !important;
    background:linear-gradient(135deg,var(--ww-brand) 0%,var(--ww-brand-2) 100%) !important;
    color:#fff !important;
    font-size:13.5px !important;
    font-weight:600 !important;
    line-height:1 !important;
    white-space:nowrap !important;
    text-decoration:none !important;
    box-shadow:0 4px 14px rgba(37,99,235,0.28) !important;
    transition:all .25s !important;
  }
  #ww-navbar .ww-phone:hover{
    transform:translateY(-1px) !important;
    box-shadow:0 6px 18px rgba(37,99,235,0.35) !important;
    color:#fff !important;
  }
  #ww-navbar .ww-phone svg{width:16px;height:16px;flex-shrink:0 !important}

  /* 移动端菜单按钮 */
  #ww-navbar .ww-toggle{
    display:none !important;
    width:40px !important;
    height:40px !important;
    border:1px solid var(--ww-border) !important;
    border-radius:8px !important;
    background:#fff !important;
    cursor:pointer !important;
    flex-direction:column !important;
    justify-content:center !important;
    align-items:center !important;
    gap:5px !important;
    padding:0 !important;
    margin:0 !important;
  }
  #ww-navbar .ww-toggle span{
    display:block !important;
    width:18px !important;
    height:2px !important;
    background:var(--ww-text) !important;
    border-radius:1px !important;
    margin:0 !important;
    transition:.25s !important;
  }

  /* ===== 响应式 ===== */
  @media (max-width:1024px){
    #ww-navbar .ww-menu{display:none !important}
    #ww-navbar .ww-toggle{display:flex !important}
    #ww-navbar.ww-scrolled{width:calc(100% - 32px) !important}
  }
  @media (max-width:640px){
    #ww-navbar{padding:0 16px !important}
    #ww-navbar.ww-scrolled{top:8px !important;max-width:calc(100% - 32px) !important}
    #ww-navbar .ww-inner{height:60px !important}
    #ww-navbar.ww-scrolled .ww-inner{height:52px !important;padding:0 18px !important}
    #ww-navbar .ww-logo img{height:36px !important}
    #ww-navbar.ww-scrolled .ww-logo img{height:30px !important}
    #ww-navbar .ww-phone span{display:none !important}
    #ww-navbar .ww-phone{padding:9px !important}
  }

</style>
