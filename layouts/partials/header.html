<!-- 导航条脚本（嵌入时复制此 script） -->
<script>
  (function(){
    var nav = document.getElementById('ww-navbar');
    if(!nav || nav.dataset.wwInit) return;
    nav.dataset.wwInit = '1';
    function onScroll(){
      if(window.scrollY > 30){
        nav.classList.add('ww-scrolled');
      }else{
        nav.classList.remove('ww-scrolled');
      }
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    onScroll();
  })();
</script>
